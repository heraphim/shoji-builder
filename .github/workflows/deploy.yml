# Build the site and publish it to GitHub Pages.
#
# Code only. A design is not code and does not deploy: saving a component, lamp
# or texture from the browser commits to the `library` branch, which this
# workflow does not watch and the site does not contain. The library is read
# from that branch at run time — see the head of src/lib/library.ts — so a save
# is public within the five minutes raw.githubusercontent.com caches for, and
# costs no Actions minutes at all.
#
# This used to say something more apologetic. Deploys were filtered with
# `paths-ignore: public/models/**` so that a save would not spend a minute of
# Actions republishing the site for one JSON file — which worked, at the price of
# a visitor seeing the library as it stood at the last *code* push. That trade is
# gone rather than tuned: nothing to filter, because a save no longer lands on
# this branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Saving three designs in a row queues three deploys; only the last one describes
# the repository, so let it cancel the ones it has already overtaken. `pending`
# rather than the run in progress: cancelling a deploy half way is how a Pages
# site ends up serving nothing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the repository name is the URL prefix the site is served under
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
