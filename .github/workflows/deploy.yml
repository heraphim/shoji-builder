# Build the site and publish it to GitHub Pages.
#
# A push of *code* deploys. A push of a design does not — saving a component,
# lamp or texture from the browser is a commit, and rebuilding the whole site for
# each one would mean a minute of Actions per save to publish one JSON file.
#
# Nothing is lost by skipping it while you are the one working: with a token the
# app reads the branch rather than the deployed site, so what you just saved is
# what the pickers list, immediately. What is deferred is the *other* visitor's
# view — they read the built site, so a design saved since the last code push is
# not there for them yet. Run this workflow by hand (Actions → Deploy to GitHub
# Pages → Run workflow) when you want the library as it stands to be public.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/models/**'
  # publish the library as it stands, without an empty commit to trigger it
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Saving three designs in a row queues three deploys; only the last one describes
# the repository, so let it cancel the ones it has already overtaken. `pending`
# rather than the run in progress: cancelling a deploy half way is how a Pages
# site ends up serving nothing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the repository name is the URL prefix the site is served under
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
