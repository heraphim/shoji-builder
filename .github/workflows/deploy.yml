# Build the site and publish it to GitHub Pages.
#
# Code only. A design is not code and does not deploy: saving a component, lamp
# or texture from the browser commits to the `library` branch, which this
# workflow does not watch and the site does not contain. The library is read
# from that branch at run time — see the head of src/lib/library.ts — so a save
# is public within the five minutes raw.githubusercontent.com caches for, and
# costs no Actions minutes at all.
#
# `paths-ignore` is still here, and the reason has changed. It used to be the
# whole mechanism — a save landed on this branch and had to be stopped from
# spending a minute of Actions to publish one JSON file, at the price of a
# visitor seeing the library as it stood at the last *code* push. Now a save goes
# to the `library` branch and this filter should never fire.
#
# It stays because "should never" was already wrong once. A browser connected
# before the library moved still had `main` in its settings and went on
# committing designs here, and each one deployed the site. `lib/library.ts`
# corrects that setting now, but the filter is the cheaper half of the defence:
# it costs nothing, and it means a design landing on this branch by any route at
# all is a file in a folder rather than a deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/models/**'
  # publish by hand when a code change is not what you are waiting for
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Saving three designs in a row queues three deploys; only the last one describes
# the repository, so let it cancel the ones it has already overtaken. `pending`
# rather than the run in progress: cancelling a deploy half way is how a Pages
# site ends up serving nothing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the repository name is the URL prefix the site is served under
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
