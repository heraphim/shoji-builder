<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#FFB43C" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#FF9A2E" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6DC"/>
      <stop offset="100%" stop-color="#FFCC6E"/>
    </linearGradient>
    <linearGradient id="paperSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0973C"/>
      <stop offset="100%" stop-color="#B9701F"/>
    </linearGradient>
    <linearGradient id="woodFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C17B39"/>
      <stop offset="100%" stop-color="#8C511F"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="32" height="32" rx="7" fill="#26364F"/>
  <!-- lamp glow -->
  <circle cx="17" cy="15" r="15" fill="url(#glow)"/>

  <!-- receding right face -->
  <path d="M23 7 28 5 28 23 23 25Z" fill="url(#paperSide)"/>
  <g fill="#7E4A1E">
    <path d="M23 11 28 9 28 12 23 14Z"/>
    <path d="M23 18 28 16 28 19 23 21Z"/>
    <rect x="27" y="2" width="2" height="27"/>
  </g>

  <!-- front face -->
  <rect x="7" y="7" width="12" height="18" fill="url(#paperFront)"/>
  <g fill="url(#woodFront)">
    <rect x="11" y="7" width="4" height="18"/>
    <rect x="7" y="11" width="12" height="3"/>
    <rect x="7" y="18" width="12" height="3"/>
  </g>

  <!-- beams: front bar + receding bar -->
  <g fill="#8E5423">
    <path d="M22 4 29 2 29 5 22 7Z"/>
    <path d="M22 25 29 23 29 26 22 28Z"/>
  </g>
  <g fill="url(#woodFront)">
    <rect x="3" y="3" width="4" height="27"/>
    <rect x="19" y="3" width="4" height="27"/>
    <rect x="2" y="4" width="20" height="3"/>
    <rect x="2" y="25" width="20" height="3"/>
  </g>
</svg>
